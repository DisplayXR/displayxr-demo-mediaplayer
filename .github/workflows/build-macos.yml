name: Build macOS

# Builds the macOS media player + .pkg installer. PR + push-to-main runs are
# validation only (build app + .pkg, assert the bundle payload). On a v* tag push
# the .pkg is attached to the GitHub Release. Mirrors the sibling demos'
# build-macos.yml. (versions.json is bumped by the Windows workflow only.)
#
# Media Player Pro (docs/PRO.md) is built (with OpenColorIO) and packaged on every
# run too, so its .pkg is validated on every PR. Release tags are separate:
#   v*      -> Stereo Media Player .pkg only (unchanged)
#   pro-v*  -> Media Player Pro .pkg only, attached to the SAME "Media Player Pro X.Y.Z"
#              release build-windows.yml creates (identical name / prerelease /
#              make_latest:false, so whichever job reaches softprops first creates it
#              and the other only adds its asset; never "latest", no versions.json).
#
# Signing (runtime #280): on a v* / pro-v* tag in the canonical repo, the released
# .pkg is Developer ID signed (payload + product archive), notarized and stapled,
# using the DisplayXR org secrets and scripts/macos_sign_notarize.sh (a verbatim copy
# of displayxr-runtime's). A manual dispatch with sign=true does the same for both
# .pkgs, as a test. Signing never gates publishing: any failure ships the .pkg
# unsigned with a warning, exactly as before.
#
# The DetectChanges job + docs_only step gating let this workflow be a required
# status check (the "Build macOS" job always runs and reports success in ~30s
# on doc-only PRs, skipping the heavy build) without blocking doc PRs. Mirrors
# the sentinel pattern in displayxr-runtime + displayxr-leia-plugin.

on:
  pull_request: {}
  push:
    branches: [ main ]
    tags: [ 'v*', 'pro-v*' ]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign + notarize both .pkgs (tests the release signing path without a tag)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  Build:
    name: Build macOS
    needs: DetectChanges
    runs-on: macos-14
    timeout-minutes: 45   # base + Pro (+ OpenColorIO) and two .pkgs
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Doc-only PR — skipping heavy build steps
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "docs_only=true; build steps will skip and report success."

      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        # OpenXR loader is built from source by scripts/build_macos.sh (no brew
        # formula). FFmpeg via Homebrew (pkg-config). The app's dylib closure is
        # bundled by a recursive otool/install_name_tool walk in create_app_bundle.sh.
        run: |
          brew install cmake ninja ffmpeg pkg-config vulkan-headers vulkan-loader molten-vk opencolorio
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Derive installer version
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: version
        run: |
          # v1.2.3 -> base 1.2.3; pro-v0.2.0 -> Pro 0.2.0. The product NOT being released
          # is still built + packaged (validation only) with a dev version, never published.
          DEV="0.0.0-dev.${GITHUB_SHA::8}"
          VERSION="$DEV"; PRO_VERSION="$DEV"
          if [[ "$GITHUB_REF" == refs/tags/pro-v* ]]; then
            PRO_VERSION="${GITHUB_REF#refs/tags/pro-v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pro_version=$PRO_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION PRO_VERSION=$PRO_VERSION"

      - name: macOS signing gate (#280)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: signgate
        env:
          SIGN_INPUT: ${{ inputs.sign }}
        run: |
          # Which .pkg globs get the product signature + notarization.
          if [ "$GITHUB_REPOSITORY" != "DisplayXR/displayxr-demo-mediaplayer" ]; then
            echo "::notice::macOS signing skipped - $GITHUB_REPOSITORY is not the canonical repo; the .pkg ships unsigned."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/pro-v* ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"; echo "pkgs=DisplayXRMediaPlayerPro-*.pkg" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"; echo "pkgs=DisplayXRMediaPlayer-*.pkg" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SIGN_INPUT" = "true" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"; echo "pkgs=DisplayXRMediaPlayer-*.pkg DisplayXRMediaPlayerPro-*.pkg" >> "$GITHUB_OUTPUT"
          else
            echo "macOS signing skipped - not a release tag build ($GITHUB_REF); the .pkgs ship unsigned."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets enter the environment ONLY in this step, and only on an eligible
      # build. The script never echoes them (no `set -x`).
      - name: Import signing identities into a temporary keychain
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.signgate.outputs.eligible == 'true'
        id: keychain
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if ! MISSING=$(./scripts/macos_sign_notarize.sh ci-secrets-check); then
            echo "::notice::macOS signing skipped - org secrets not provisioned: $MISSING. The .pkg ships unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Writes DXR_MACOS_{KEYCHAIN,APP_IDENTITY,INSTALLER_IDENTITY} and
          # DXR_NOTARY_KEY_{PATH,ID} / DXR_NOTARY_ISSUER into $GITHUB_ENV.
          if ./scripts/macos_sign_notarize.sh ci-keychain-setup --env-out "$GITHUB_ENV"; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS signing DISABLED - importing the signing identities failed (see log above). The .pkg ships UNSIGNED."
            ./scripts/macos_sign_notarize.sh ci-keychain-teardown || true
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      # With the keychain set up, build_installer.sh's sign-tree gives every payload
      # Mach-O its Developer ID + hardened-runtime signature as its last step.
      # DXR_MACOS_INSTALLER_IDENTITY is withheld so the product archives come out
      # unsigned; the released one is signed + notarized below, with the unsigned
      # .pkg as the fallback.
      - name: Build demo + Pro + installers
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          DISPLAYXR_VERSION: ${{ steps.version.outputs.version }}
          MP_PRO_VERSION: ${{ steps.version.outputs.pro_version }}
          DXR_MACOS_SIGN_FALLBACK: adhoc
          DXR_MACOS_SIGN_STATUS_FILE: ${{ runner.temp }}/dxr-macos-sign-status
        run: env -u DXR_MACOS_INSTALLER_IDENTITY ./scripts/build_macos.sh --installer --pro --ocio

      # MP_BUILD_TESTS defaults OFF, so nothing ran ctest before this — the unit tests
      # existed but never executed in CI. Re-configure the tree build_macos.sh already
      # populated (incremental: no re-fetch of SDL3/imgui/OpenXR) and run them.
      # stereo_sweep needs the generated corpus and exits 0 with a notice without it, so
      # CI stays green without building gigabytes of fixtures.
      - name: Unit tests
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          cmake -S . -B build -DMP_BUILD_TESTS=ON
          cmake --build build --target lif_roundtrip_test stereo_detect_test \
                                     mpo_parse_test camera_select_test auto_convergence_test stereo_packing_test eye_assign_test stream_url_test lift_client_test input_provider_client_test color_test \
                                     stereo_sweep live_pixels_test timecode_pairer_test resolve_link_test thumbnail_test scopes_test overlays_test compare_clip_test look_loader_test rig_check_test                                      image_sequence_test decode_formats_test ocio_bake_test short_clip_test
          ctest --test-dir build --output-on-failure

      - name: Assert .pkg payload (regression guard)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          PKG=$(find _package -maxdepth 1 -name "DisplayXRMediaPlayer-*.pkg" -type f | head -1)
          if [ -z "$PKG" ] || [ ! -f "$PKG" ]; then
            echo "::error::DisplayXRMediaPlayer-*.pkg missing from _package/"; ls -la _package/ || true; exit 1
          fi
          echo "Found installer: $PKG"
          EXPAND_DIR=$(mktemp -d)
          pkgutil --expand "$PKG" "$EXPAND_DIR/expand"
          PAYLOAD="$EXPAND_DIR/expand/mediaplayer.pkg/Payload"
          if [ ! -f "$PAYLOAD" ]; then
            echo "::error::mediaplayer.pkg/Payload not found inside .pkg"; ls -la "$EXPAND_DIR/expand/" || true; exit 1
          fi
          gunzip -c "$PAYLOAD" | cpio -i -t > "$EXPAND_DIR/files" 2>/dev/null

          MISSING=0
          assert_present() {
            if ! grep -q "$1" "$EXPAND_DIR/files"; then
              echo "::error::$2 missing from .pkg payload (pattern: $1)"; MISSING=1
            fi
          }
          APP='Applications/Stereo Media Player\.app/Contents'
          assert_present "$APP/MacOS/Stereo Media Player" "launcher"
          assert_present "$APP/Resources/mediaplayer_handle_vk_macos" "demo binary"
          assert_present "$APP/Resources/lib/libMoltenVK" "MoltenVK"
          assert_present "$APP/Resources/lib/libvulkan" "Vulkan loader"
          assert_present "$APP/Resources/lib/libopenxr_loader" "OpenXR loader"
          assert_present "$APP/Resources/lib/libavcodec" "FFmpeg avcodec"
          assert_present "$APP/Resources/lib/libavformat" "FFmpeg avformat"
          assert_present "$APP/Resources/displayxr/mediaplayer_handle_vk_macos\.displayxr\.json" "DisplayXR app manifest"
          assert_present "$APP/Resources/displayxr/icon\.png" "manifest 2D icon"
          assert_present "$APP/Resources/displayxr/icon_sbs\.png" "manifest 3D icon"
          if [ "$MISSING" -ne 0 ]; then echo "Payload listing:"; cat "$EXPAND_DIR/files"; exit 1; fi
          echo "PASS: .pkg payload contains app + MoltenVK/Vulkan/OpenXR + FFmpeg dylibs + DisplayXR manifest/icons."
          # Every Mach-O in the shipped payload loads only bundle-relative paths (v1.14.2
          # shipped /opt/homebrew/lib + /tmp/openxr-install/lib rpaths ahead of the bundle).
          pkgutil --expand-full "$PKG" "$EXPAND_DIR/full"
          bash installer/macos/check_bundle_paths.sh "$EXPAND_DIR/full/mediaplayer.pkg/Payload/Applications/Stereo Media Player.app"

      - name: Assert Pro .pkg payload (regression guard)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          PKG=$(find _package -maxdepth 1 -name "DisplayXRMediaPlayerPro-*.pkg" -type f | head -1)
          if [ -z "$PKG" ] || [ ! -f "$PKG" ]; then
            echo "::error::DisplayXRMediaPlayerPro-*.pkg missing from _package/"; ls -la _package/ || true; exit 1
          fi
          echo "Found Pro installer: $PKG"
          EXPAND_DIR=$(mktemp -d)
          pkgutil --expand "$PKG" "$EXPAND_DIR/expand"
          PAYLOAD="$EXPAND_DIR/expand/mediaplayer_pro.pkg/Payload"
          if [ ! -f "$PAYLOAD" ]; then
            echo "::error::mediaplayer_pro.pkg/Payload not found inside .pkg"; ls -la "$EXPAND_DIR/expand/" || true; exit 1
          fi
          # Own component id, so it installs alongside the Stereo Media Player.
          grep -q 'identifier="com.displayxr.mediaplayer.pro"' "$EXPAND_DIR/expand/mediaplayer_pro.pkg/PackageInfo" \
            || { echo "::error::Pro component identifier is not com.displayxr.mediaplayer.pro"; exit 1; }
          gunzip -c "$PAYLOAD" | cpio -i -t > "$EXPAND_DIR/files" 2>/dev/null

          MISSING=0
          assert_present() {
            if ! grep -q "$1" "$EXPAND_DIR/files"; then
              echo "::error::$2 missing from Pro .pkg payload (pattern: $1)"; MISSING=1
            fi
          }
          APP='Applications/Media Player Pro\.app/Contents'
          assert_present "$APP/MacOS/Media Player Pro" "launcher"
          assert_present "$APP/Resources/mediaplayer_pro_handle_vk_macos" "Pro binary"
          assert_present "$APP/Resources/lib/libMoltenVK" "MoltenVK"
          assert_present "$APP/Resources/lib/libvulkan" "Vulkan loader"
          assert_present "$APP/Resources/lib/libopenxr_loader" "OpenXR loader"
          assert_present "$APP/Resources/lib/libavcodec" "FFmpeg avcodec"
          assert_present "$APP/Resources/lib/libavformat" "FFmpeg avformat"
          assert_present "$APP/Resources/lib/libOpenColorIO" "OpenColorIO"
          assert_present "$APP/Resources/lib/libImath" "Imath (OpenColorIO dep)"
          assert_present "$APP/Resources/lib/libyaml-cpp" "yaml-cpp (OpenColorIO dep)"
          assert_present "$APP/Resources/displayxr/mediaplayer_pro_handle_vk_macos\.displayxr\.json" "DisplayXR app manifest"
          assert_present "$APP/Resources/displayxr/icon\.png" "manifest 2D icon"
          assert_present "$APP/Resources/displayxr/icon_sbs\.png" "manifest 3D icon"
          if grep -q 'Stereo Media Player\.app' "$EXPAND_DIR/files"; then
            echo "::error::Pro .pkg carries the Stereo Media Player app"; MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then echo "Payload listing:"; cat "$EXPAND_DIR/files"; exit 1; fi
          echo "PASS: Pro .pkg payload contains Media Player Pro.app + MoltenVK/Vulkan/OpenXR + FFmpeg + OpenColorIO dylibs + manifest/icons."
          pkgutil --expand-full "$PKG" "$EXPAND_DIR/full"
          bash installer/macos/check_bundle_paths.sh "$EXPAND_DIR/full/mediaplayer_pro.pkg/Payload/Applications/Media Player Pro.app"

      - name: Sign, notarize and staple the .pkg (#280)
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.keychain.outputs.sign == 'true'
        id: notarize
        timeout-minutes: 60
        env:
          PKG_GLOBS: ${{ steps.signgate.outputs.pkgs }}
          DXR_MACOS_SIGN_STATUS_FILE: ${{ runner.temp }}/dxr-macos-sign-status
        run: |
          set -uo pipefail
          SUMMARY=""
          for GLOB in $PKG_GLOBS; do
            PKG=$(find _package -maxdepth 1 -name "$GLOB" -type f | head -1)
            [ -n "$PKG" ] || { echo "::error::no $GLOB in _package/"; exit 1; }
            NAME=$(basename "$PKG")
            LABEL="${NAME%%-*}"  # DisplayXRMediaPlayer / DisplayXRMediaPlayerPro
            if grep -q "adhoc-fallback $LABEL\$" "$DXR_MACOS_SIGN_STATUS_FILE" 2>/dev/null; then
              echo "::warning::$NAME ships UNSIGNED - Developer ID signing of its payload fell back to ad-hoc (see the build step)."
              SUMMARY="$SUMMARY $NAME=unsigned(payload-fallback)"
              continue
            fi
            cp "$PKG" "$RUNNER_TEMP/$NAME.unsigned"
            # finalize-pkg = productsign -> notarytool submit --wait -> stapler staple;
            # verify-pkg = pkgutil --check-signature + stapler validate + spctl
            # --assess --type install "Notarized Developer ID".
            if ./scripts/macos_sign_notarize.sh finalize-pkg "$PKG" \
               && ./scripts/macos_sign_notarize.sh verify-pkg "$PKG"; then
              echo "::notice::$NAME is Developer ID signed, notarized and stapled."
              SUMMARY="$SUMMARY $NAME=notarized"
            else
              # Signing never gates publishing.
              echo "::warning::$NAME ships UNSIGNED - productsign / notarization / stapling failed (see log above). Re-run this job to retry."
              cp -f "$RUNNER_TEMP/$NAME.unsigned" "$PKG"
              SUMMARY="$SUMMARY $NAME=unsigned(sign/notarize failed)"
            fi
          done
          echo "result=${SUMMARY# }" >> "$GITHUB_OUTPUT"

      - name: Signature summary
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          RESULT: ${{ steps.notarize.outputs.result || 'unsigned (signing not enabled for this build)' }}
        run: |
          echo "macOS installers: $RESULT"
          { echo "### macOS installer signatures"; echo; echo "$RESULT"; echo
            for PKG in _package/*.pkg; do
              echo "\`$(basename "$PKG")\`"; echo '```'; pkgutil --check-signature "$PKG" 2>&1 | head -6 || true; echo '```'
            done; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          retention-days: 3
          name: DisplayXRMediaPlayer-macOS
          if-no-files-found: error
          path: _package/DisplayXRMediaPlayer-*.pkg

      - name: Upload Pro installer
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          retention-days: 3
          name: DisplayXRMediaPlayerPro-macOS
          if-no-files-found: error
          path: _package/DisplayXRMediaPlayerPro-*.pkg

      # Pro releases: same release as build-windows.yml's pro-v* step. Mirrors its name /
      # draft / prerelease / make_latest EXACTLY (make_latest must be spelled out: an
      # update without it could flip "latest" to Pro). No generate_release_notes: only the
      # Windows workflow sets it (the action appends notes to the body on update, so a
      # second setter would repeat them). Only the Pro .pkg glob is uploaded, so the
      # Windows .exe already on the release is never touched.
      - name: Attach Pro .pkg to GitHub release on pro-v* tag
        if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/pro-v')
        uses: softprops/action-gh-release@v3
        with:
          files: _package/DisplayXRMediaPlayerPro-*.pkg
          fail_on_unmatched_files: true
          name: Media Player Pro ${{ steps.version.outputs.pro_version }}
          draft: false
          prerelease: false
          make_latest: false

      - name: Attach .pkg to GitHub release on tag
        if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: _package/DisplayXRMediaPlayer-*.pkg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          if [ -x scripts/macos_sign_notarize.sh ]; then
            ./scripts/macos_sign_notarize.sh ci-keychain-teardown
          fi
